# AeroMind local dev stack. File processing runs in a separate worker container.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aeromind
      POSTGRES_USER: aeromind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - aeromind-postgres:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - aeromind-net
      - engineering-worker-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeromind -d aeromind"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "10000:10000"
    mem_limit: 1g
    cpus: "1.5"
    environment:
      AEROMIND_ENV: development
      PORT: 10000
      AEROMIND_SESSION_SECRET: local-compose-secret-change-me-32-bytes
      DATABASE_URL: postgresql://aeromind:${POSTGRES_PASSWORD}@db:5432/aeromind
      AEROMIND_ALLOWED_ORIGINS: http://localhost:10000
      AEROMIND_ALLOWED_HOSTS: localhost,127.0.0.1
      HARDWARE_CONTROL: "false"
      AEROMIND_TRIAL_EMAILS: demo@example.com
      AEROMIND_AUTO_CREATE_SCHEMA: "true"
      AEROMIND_ENGINEERING_WORKER_ENABLED: "true"
      AEROMIND_ENGINEERING_INLINE_WORKER: "false"
      AEROMIND_ENGINEERING_STORAGE_DIR: /app/data/engineering_files
    volumes:
      - aeromind-engineering-files:/app/data/engineering_files
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - aeromind-net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:10000/api/ready\", timeout=3)' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  engineering-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    command: ["python", "-m", "web.engineering_worker"]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    mem_limit: 512m
    cpus: "1.0"
    environment:
      AEROMIND_ENV: development
      DATABASE_URL: postgresql://aeromind:${POSTGRES_PASSWORD}@db:5432/aeromind
      AEROMIND_AUTO_CREATE_SCHEMA: "false"
      AEROMIND_ENGINEERING_STORAGE_DIR: /app/data/engineering_files
      AEROMIND_ENGINEERING_WORKER_POLL_SECONDS: "0.5"
      AEROMIND_ENGINEERING_REQUIRE_AV_SCAN: "false"
      HARDWARE_CONTROL: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - aeromind-engineering-files:/app/data/engineering_files
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - engineering-worker-net
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time,sys; p=pathlib.Path('/app/data/engineering_files/.worker-heartbeat'); sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime < 30 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  aeromind-postgres:
  aeromind-engineering-files:

networks:
  aeromind-net:
    driver: bridge
  engineering-worker-net:
    driver: bridge
    internal: true
