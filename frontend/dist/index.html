    <script>
      (() => {
        const supported = new Set(["fr", "en"]);
        let selected = null;
        try {
          const stored = localStorage.getItem("aeromind-language");
          if (supported.has(stored)) selected = stored;
        } catch {}
        if (!selected) {
          const browserLanguages = [...(navigator.languages || []), navigator.language || ""];
          selected = browserLanguages.map(value => value.toLowerCase().split("-")[0]).find(value => supported.has(value)) || "en";
          try { localStorage.setItem("aeromind-language", selected); } catch {}
        }
        document.documentElement.lang = selected;
        window.__AEROMIND_INITIAL_LANGUAGE__ = selected;
      })();
