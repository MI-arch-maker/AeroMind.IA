services:
  - type: web
    name: aeromind-ai
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    autoDeploy: false
    envVars:
      - key: AEROMIND_ENV
        value: production
      - key: AEROMIND_AUTO_CREATE_SCHEMA
        value: "false"
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: aeromind-db
          property: connectionString
      - key: AEROMIND_SESSION_SECRET
        generateValue: true
      - key: AEROMIND_ALLOWED_HOSTS
        sync: false
      - key: AEROMIND_ALLOWED_ORIGINS
        sync: false
      - key: AEROMIND_SUPERADMIN_EMAILS
        value: mcgregoralvin14@gmail.com
      - key: AEROMIND_TRIAL_EMAILS
        value: demo@example.com
      - key: DEFAULT_DEMO_EMAIL
        value: mcgregoralvin14@gmail.com
      - key: ENTRA_TENANT_ID
        sync: false
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: ENTRA_CLIENT_SECRET
        sync: false
      - key: ENTRA_REDIRECT_URI
        sync: false
      # Alternative : utiliser OIDC_* au lieu de ENTRA_*.
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: OIDC_REDIRECT_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_BASE
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: HARDWARE_CONTROL
        value: "false"
      - key: AEROMIND_GEOFENCE
        sync: false
      - key: AEROMIND_MAVLINK_URL
        sync: false
      - key: AEROMIND_MAVLINK_OBSERVER_URL
        sync: false
      - key: AEROMIND_MAVLINK_HEARTBEAT_TIMEOUT_S
        value: "5"
      - key: AEROMIND_MAVLINK_RECONNECT_INTERVAL_S
        value: "5"

databases:
  - name: aeromind-db
    plan: free
    region: frankfurt
    databaseName: aeromind
    user: aeromind
